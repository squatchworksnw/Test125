name: Apply Navigation Mercy Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation mercy patch
        run: node .github/scripts/navigation-mercy-patch.js
      - name: Commit patched app shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          if git diff --cached --quiet; then
            echo "No shell patch changes needed."
          else
            git commit -m "Apply navigation mercy shell patch"
            git push
          fi
