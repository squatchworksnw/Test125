name: Apply Submitter Clarity Fixes

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clarity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Patch submitter clarity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8-sig')
          replacements = [
            ("Requests, files, estimates, and material lists go through Needs Review before they become active work.", "Requests, files, estimates, receipts, and purchase or supply requests go through Needs Review before they become active work."),
            ("onclick=\"showView('importReview')\">Submit New Request", "onclick=\"openSubmitRequest()\">Submit New Request"),
            ("onclick=\"showView('materials')\">Submit Material List", "onclick=\"openSupplyRequest()\">Purchase / Supply Request"),
            ("<span>Submit Material List</span>", "<span>Purchase / Supply Request</span>"),
            ("<em>Lightweight takeoffs and purchase needs for approval.</em>", "<em>Materials, supplies, event needs, gifts, marketing items, or other order requests.</em>"),
            ("onclick=\"showView('importReview')\">\n        <span>View My Submissions</span>", "onclick=\"openMySubmissions()\">\n        <span>View My Submissions</span>"),
            ("<button class=\"workspace-card calendar\" type=\"button\">\n        <span>Assigned Work</span>\n        <strong>Coming from workspace permissions</strong>\n        <em>Assigned work can appear here when the workspace grants access.</em>\n      </button>", "<button class=\"workspace-card calendar\" type=\"button\" onclick=\"showAssignedWorkUnavailable()\">\n        <span>Assigned Work</span>\n        <strong>Not available yet</strong>\n        <em>Assigned work will appear here when a manager assigns something to you.</em>\n      </button>"),
            ("<span>Materials / Takeoffs</span>\n        <strong>Review first</strong>\n        <em>Contractor material lists staged for approval before becoming budget records.</em>", "<span>Supplies / Materials</span>\n        <strong>Review first</strong>\n        <em>Materials, supplies, event needs, gifts, marketing items, or other order requests.</em>"),
            ("<h2>Materials / Takeoffs</h2>\n          <p class=\"meta\">Fast material lists for contractor review. Approved lists become budget items linked to projects, work orders, vendors, and receipts.</p>", "<h2>Supplies / Materials</h2>\n          <p class=\"meta\">This can be used for materials, supplies, event needs, gifts, marketing items, or other purchase/order requests. Items wait in Needs Review before anything becomes official.</p>"),
            ("List title<input id=\"materialTitle\" required placeholder=\"Restroom 2 sink repair materials\"", "Request title<input id=\"materialTitle\" required placeholder=\"Restroom 2 sink repair supplies, event gifts, marketing items...\""),
            ("Material lines<textarea id=\"materialLines\" required placeholder=\"Description | quantity | unit | estimated unit cost | actual cost", "Supply / material lines<textarea id=\"materialLines\" required placeholder=\"Description | quantity | unit | estimated unit cost | actual cost"),
            ("Why it is needed, substitution notes, approval context...", "Why it is needed, timing, substitution notes, approval context..."),
            ("Submit Material List</button>", "Submit Supply / Material Request</button>"),
            ("<h3>Materials Needing Review</h3>", "<h3>Supplies / Materials Needing Review</h3>"),
            ("Lists wait here until Owner/Admin approves them into budget tracking.", "Requests wait here until Owner/Admin reviews and routes them."),
            ("<p class=\"meta\">Upload a photo, receipt, PDF estimate or invoice, spreadsheet, or supporting file. The app routes it safely behind the scenes.</p>", "<p class=\"meta\">Upload a photo, receipt, PDF estimate or invoice, spreadsheet, or supporting file. Uploads go to Needs Review first. Uploading a receipt or proof helps route and review the expense, but does not replace any required accounting receipt process. Accounting routing can be added later if needed.</p>"),
            ("<label>Upload file<input id=\"documentUpload\"", "<p class=\"meta full\">Uploading a receipt or proof helps route and review the expense, but does not replace any required accounting receipt process.</p>\n        <label>Upload file<input id=\"documentUpload\""),
            ("<h3>Needs Review</h3>\n          <p class=\"meta\">Approve when it is ready to become operational work.</p>", "<h3>Needs Review</h3>\n          <p class=\"meta\">Submitted items, uploads, receipts, estimates, and supply requests stay here until they are reviewed.</p>"),
          ]
          for old, new in replacements:
            if old not in html:
              print(f'HTML pattern not found: {old[:80]}')
            html = html.replace(old, new)
          html = html.replace('?v=20260518-qa4', '?v=20260518-qa5')
          index_path.write_text('\ufeff' + html.lstrip('\ufeff'), encoding='utf-8')

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('if(importMeta) importMeta.textContent = submitterOnly\n    ? \"Send a work request, receipt note, photo/document note, or field issue to the operations team.\"\n    : \"Requests, files, receipts, estimates, material lists, and spreadsheet rows wait here before becoming active work.\";', 'if(importMeta) importMeta.textContent = submitterOnly\n    ? \"Send a work request, receipt note, photo/document note, supply request, or field issue to the operations team.\"\n    : \"Requests, files, receipts, estimates, supply/material requests, and spreadsheet rows wait here before becoming active work.\";')
          app = app.replace('if(reviewListTitle) reviewListTitle.textContent = submitterOnly ? \"My Submissions\" : \"Waiting for Review\";', 'if(reviewListTitle) reviewListTitle.textContent = submitterOnly ? \"My Submissions\" : \"Needs Review\";')
          app = app.replace('if(reviewListMeta) reviewListMeta.textContent = submitterOnly ? \"Requests and uploaded items visible to your account.\" : \"Approve when it is ready to become active work.\";', 'if(reviewListMeta) reviewListMeta.textContent = submitterOnly ? \"Requests and uploaded items visible to your account.\" : \"Submitted items, uploads, receipts, estimates, and supply requests stay here until they are reviewed.\";')
          app = app.replace('if(documentsMeta) documentsMeta.textContent = submitterOnly ? \"Upload a photo, receipt, PDF, spreadsheet, or file for the operations team.\" : \"Upload a photo, receipt, PDF estimate or invoice, spreadsheet, or supporting file and link it to the right work.\";', 'if(documentsMeta) documentsMeta.textContent = submitterOnly ? \"Upload a photo, receipt, PDF, spreadsheet, or file for the operations team. Uploading a receipt or proof helps route and review the expense, but does not replace any required accounting receipt process. Uploads go to Needs Review first.\" : \"Upload a photo, receipt, PDF estimate or invoice, spreadsheet, or supporting file and link it to the right work. Uploading a receipt or proof helps route and review the expense, but does not replace any required accounting receipt process. Accounting routing can be added later if needed.\";')
          helper = '''
function setFormCollapsed(formId, collapsed){
  const form = document.getElementById(formId);
  const panel = form?.closest?.(".panel");
  if(!panel) return;
  panel.dataset.formCollapsed = collapsed ? "true" : "false";
  const button = panel.querySelector?.(".form-disclosure-btn");
  if(button){
    const defaultLabel = formId === "taskForm" ? "Create Work Order" : formId === "submissionForm" ? "Submit Request" : formId === "fileForm" ? "Upload File" : "Add / Edit";
    button.textContent = collapsed ? defaultLabel : "Hide Form";
    button.setAttribute("aria-expanded", collapsed ? "false" : "true");
  }
}

function openSubmitRequest(){
  showView("importReview");
  setFormCollapsed("submissionForm", false);
}

function openMySubmissions(){
  showView("importReview");
  setFormCollapsed("submissionForm", true);
}

function openSupplyRequest(){
  showView("materials");
  setFormCollapsed("materialForm", false);
}

function showAssignedWorkUnavailable(){
  setStatus("Assigned work is not available yet.");
  InteractionService?.showToast?.("Assigned work is not available yet.", "pending");
}

'''
          if 'function openMySubmissions(){' not in app:
            app = app.replace('function goBackView(){', helper + 'function goBackView(){')
          app = app.replace('Object.assign(globalThis, {', 'Object.assign(globalThis, {\n  openSubmitRequest, openMySubmissions, openSupplyRequest, showAssignedWorkUnavailable,')
          app_path.write_text(app, encoding='utf-8')

          interaction_path = Path('services/interaction-service.js')
          interaction = interaction_path.read_text(encoding='utf-8')
          interaction = interaction.replace('{ label:"Submit Request", view:"importReview", detail:"Send location, urgency, notes, and an optional file." },\n    { label:"Upload File", view:"documents", detail:"Photo, PDF, spreadsheet, estimate, or supporting document." },\n    { label:"Upload Receipt", view:"documents", detail:"Gas, supply, invoice, or purchase receipt." }', '{ label:"Submit Request", view:"importReview", action:"openSubmitRequest", detail:"Send location, urgency, notes, and an optional file." },\n    { label:"Upload File", view:"documents", detail:"Photo, PDF, spreadsheet, estimate, or supporting document. Uploads go to Needs Review first." },\n    { label:"Upload Receipt", view:"documents", detail:"Gas, supply, invoice, or purchase receipt. This helps route review, but does not replace any required accounting receipt process." },\n    { label:"Purchase / Supply Request", view:"materials", action:"openSupplyRequest", detail:"Materials, supplies, event needs, gifts, marketing items, or other purchase/order requests." }')
          interaction = interaction.replace('<button class="add-new-option" type="button" data-target-view="${esc(option.view)}">', '<button class="add-new-option" type="button" data-target-view="${esc(option.view)}" data-target-action="${esc(option.action || "")}">')
          interaction = interaction.replace('const view = button.dataset.targetView;\n    closeAddNew();\n    if(typeof window.showView === "function") window.showView(view);', 'const view = button.dataset.targetView;\n    const action = button.dataset.targetAction;\n    closeAddNew();\n    if(action && typeof window[action] === "function") window[action]();\n    else if(typeof window.showView === "function") window.showView(view);')
          interaction_path.write_text(interaction, encoding='utf-8')

          materials_path = Path('views/materials.js')
          materials = materials_path.read_text(encoding='utf-8')
          materials = materials.replace('return card(data.title || review.description || "Material takeoff", [', 'return card(data.title || review.description || "Supply / material request", [')
          materials = materials.replace('empty("No material lists waiting yet.")', 'empty("No supply or material requests waiting yet.")')
          materials = materials.replace('if(!requireInsertPermission("field_ops_import_reviews", "submit material lists")) return;', 'if(!requireInsertPermission("field_ops_import_reviews", "submit supply or material requests")) return;')
          materials = materials.replace('setInlineState("materialSaveState", "Sending material list...", "pending");', 'setInlineState("materialSaveState", "Sending supply / material request...", "pending");')
          materials = materials.replace('source:canSubmitOnly() ? "contractor material list" : "materials workspace"', 'source:canSubmitOnly() ? "purchase / supply request" : "supplies / materials workspace"')
          materials = materials.replace('setInlineState("materialSaveState", "Material list sent for review", "saved");', 'setInlineState("materialSaveState", "Supply / material request sent for review", "saved");')
          materials = materials.replace('await refreshAfterWrite?.("Material list sent for review");', 'await refreshAfterWrite?.("Supply / material request sent for review");')
          materials = materials.replace('setStatus("Material list approved to budget");', 'setStatus("Supply / material request approved to budget");')
          materials = materials.replace('await refreshAfterWrite?.("Material list approved to budget");', 'await refreshAfterWrite?.("Supply / material request approved to budget");')
          materials_path.write_text(materials, encoding='utf-8')
          PY
      - name: Commit submitter clarity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js services/interaction-service.js views/materials.js
          if git diff --cached --quiet; then
            echo "No submitter clarity changes needed."
          else
            git commit -m "Clarify submitter portal requests and uploads"
            git push origin HEAD:v2
          fi
