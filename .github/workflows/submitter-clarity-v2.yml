name: Apply Submitter Clarity Fixes

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clarity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Run submitter clarity patch
        run: python .github/scripts/submitter-clarity-v2.py
      - name: Commit submitter clarity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js services/interaction-service.js views/materials.js
          if git diff --cached --quiet; then
            echo "No submitter clarity changes needed."
          else
            git commit -m "Clarify submitter portal requests and uploads"
            git push origin HEAD:v2
          fi
