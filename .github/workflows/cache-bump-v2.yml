name: Bump V2 Asset Cache

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Bump local asset version
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8-sig')
          html = re.sub(r'\?v=20260518-qa[0-9]+', '?v=20260518-qa3', html)
          p.write_text('\ufeff' + html.lstrip('\ufeff'), encoding='utf-8')
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache bump needed."
          else
            git commit -m "Bump stabilization asset version"
            git push origin HEAD:v2
          fi
