name: Apply V2 Navigation Mercy Patch

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Apply v2 navigation mercy patch
        run: node .github/scripts/navigation-mercy-v2-patch.js
      - name: Commit patched v2 shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          if git diff --cached --quiet; then
            echo "No v2 shell patch changes needed."
          else
            git commit -m "Apply v2 navigation mercy shell patch"
            git push origin HEAD:v2
          fi
