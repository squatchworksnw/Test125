name: Apply Runtime Navigation Mercy Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime navigation mercy patch
        run: node .github/scripts/navigation-mercy-runtime-patch.js
      - name: Commit patched runtime shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages-runtime/index.html github-pages-runtime/app.js
          if git diff --cached --quiet; then
            echo "No runtime shell patch changes needed."
          else
            git commit -m "Apply runtime navigation mercy shell patch"
            git push
          fi
