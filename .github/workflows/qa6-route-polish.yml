name: QA6 Route Polish

on:
  push:
    branches:
      - v2
    paths:
      - .github/scripts/qa6_route_polish.py
      - .github/workflows/qa6-route-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Apply route polish
        run: python .github/scripts/qa6_route_polish.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No route changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git commit -m "Polish submitter upload route"
          git push
