name: Polish Demo Save Feedback

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Patch demo write handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text(encoding='utf-8')
          old = '''function handleWriteError(err){
  console.error(err);
  setStatus(permissionAwareErrorMessage(err));
}'''
          new = '''function handleWriteError(err){
  const message = permissionAwareErrorMessage(err);
  if(String(err?.message || '').includes('Session demo is read-only')){
    console.warn(message);
    setStatus(message);
    return;
  }
  console.error(err);
  setStatus(message);
}'''
          if old not in text:
            raise SystemExit('handleWriteError block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit demo polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No demo polish changes needed."
          else
            git commit -m "Polish demo write feedback"
            git push origin HEAD:v2
          fi
