name: Apply V2 QA Polish

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Patch QA polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('const collapsedForms = ["projectForm","vendorForm","bidForm","materialForm","taskForm","buildingForm","spaceForm","assetForm","vehicleForm","fuelReceiptForm","budgetForm"];', 'const collapsedForms = ["submissionForm","fileForm","projectForm","vendorForm","bidForm","materialForm","taskForm","buildingForm","spaceForm","assetForm","vehicleForm","fuelReceiptForm","budgetForm"];')
          app = app.replace('button.textContent = formId === "taskForm" ? "Create Work Order" : "Add / Edit";', 'const defaultLabel = formId === "taskForm" ? "Create Work Order" : formId === "submissionForm" ? "Submit Request" : formId === "fileForm" ? "Upload File" : "Add / Edit";\n    button.textContent = defaultLabel;')
          app = app.replace('button.textContent = collapsed ? "Hide Form" : (formId === "taskForm" ? "Create Work Order" : "Add / Edit");', 'button.textContent = collapsed ? "Hide Form" : defaultLabel;')
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8-sig')
          html = html.replace('<h3>Waiting for Review</h3>', '<h3>Needs Review</h3>')
          html = html.replace('?v=20260518-qa3', '?v=20260518-qa4')
          index_path.write_text('\ufeff' + html.lstrip('\ufeff'), encoding='utf-8')
          PY
      - name: Commit QA polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No QA polish changes needed."
          else
            git commit -m "Polish QA form disclosure and review wording"
            git push origin HEAD:v2
          fi
