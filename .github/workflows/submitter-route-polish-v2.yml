name: Apply Submitter Route Polish

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - name: Run route polish patch
        run: python .github/scripts/submitter-route-polish-v2.py
      - name: Commit route polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No route polish changes needed."
          else
            git commit -m "Polish submitter portal routes"
            git push origin HEAD:v2
          fi
